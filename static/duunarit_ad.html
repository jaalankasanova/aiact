<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: #0f2744;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .ad {
    width: 1080px;
    height: 1920px;
    background: linear-gradient(160deg, #0f2744 0%, #1a3a6b 60%, #0f2744 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 120px 80px;
    position: relative;
  }

  /* Background decorative circles */
  .bg-circle-1 {
    position: absolute;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.04);
    top: -100px;
    right: -200px;
  }
  .bg-circle-2 {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.06);
    bottom: 200px;
    left: -150px;
  }
  .bg-dot-grid {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .top-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 1;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 80px;
  }
  .logo-icon {
    width: 90px;
    height: 90px;
    flex-shrink: 0;
  }
  .logo-text {
    font-size: 52px;
    font-weight: 800;
    color: white;
    letter-spacing: -1px;
  }

  .tag {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.9);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 40px;
    border-radius: 100px;
    margin-bottom: 80px;
  }

  .headline {
    font-size: 100px;
    font-weight: 900;
    color: white;
    text-align: center;
    line-height: 1.05;
    letter-spacing: -2px;
  }
  .headline .accent {
    color: #4a9eff;
  }

  .mid-section {
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    width: 100%;
  }

  .visual-block {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 32px;
    padding: 60px 70px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .feature-row {
    display: flex;
    align-items: center;
    gap: 36px;
  }
  .feature-icon {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: rgba(74,158,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    flex-shrink: 0;
  }
  .feature-text {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .feature-title {
    color: white;
    font-size: 38px;
    font-weight: 700;
  }
  .feature-sub {
    color: rgba(255,255,255,0.6);
    font-size: 28px;
  }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.1);
    width: 100%;
  }

  .bottom-section {
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    width: 100%;
  }

  .cta-btn {
    background: #4a9eff;
    color: white;
    font-size: 48px;
    font-weight: 800;
    padding: 44px 100px;
    border-radius: 24px;
    text-align: center;
    width: 100%;
    letter-spacing: -0.5px;
  }

  .url-text {
    color: rgba(255,255,255,0.45);
    font-size: 30px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="bg-dot-grid"></div>
  <div class="bg-circle-1"></div>
  <div class="bg-circle-2"></div>

  <div class="top-section">
    <div class="logo-wrap">
      <svg class="logo-icon" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="90" height="90" rx="22" fill="#1a3a6b"/>
        <circle cx="45" cy="34" r="13" fill="white"/>
        <path d="M17 78c0-15.5 12.5-28 28-28s28 12.5 28 28" stroke="white" stroke-width="7" stroke-linecap="round" fill="none"/>
      </svg>
      <span class="logo-text">Duunarit</span>
    </div>

    <div class="tag">Uusi työ odottaa</div>

    <div class="headline">
      Löydä työ<br>
      joka <span class="accent">sopii</span><br>
      sinulle
    </div>
  </div>

  <div class="mid-section">
    <div class="visual-block">
      <div class="feature-row">
        <div class="feature-icon">🎯</div>
        <div class="feature-text">
          <span class="feature-title">Palkka- tai freelancer-duunit</span>
          <span class="feature-sub">Valitse itsellesi sopiva työsuhde</span>
        </div>
      </div>
      <div class="divider"></div>
      <div class="feature-row">
        <div class="feature-icon">⚡</div>
        <div class="feature-text">
          <span class="feature-title">Haku vie alle 2 min</span>
          <span class="feature-sub">Ei turhaa byrokratiaa</span>
        </div>
      </div>
      <div class="divider"></div>
      <div class="feature-row">
        <div class="feature-icon">🇫🇮</div>
        <div class="feature-text">
          <span class="feature-title">Suomalaiset työnantajat</span>
          <span class="feature-sub">Paikalliset työpaikat, oikeat ihmiset</span>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-section">
    <div class="cta-btn">Hae töihin nyt — ilmaiseksi</div>
    <span class="url-text">duunarit.com</span>
  </div>
</div>
</body>
</html>
