{% extends "rahtari/base.html" %}
{% block title %}Rekisteröidy kuljettajaksi — RAHTARI{% endblock %}
{% block content %}
<div style="max-width:620px;margin:2rem auto">
  <div class="section-title">Rekisteröidy kuljettajaksi</div>
  <form method="POST">
    <div class="grid-2">
      <div class="form-group"><label>Nimi *</label><input type="text" name="nimi" required></div>
      <div class="form-group"><label>Puhelin * <span style="font-weight:400;text-transform:none">(SMS-ilmoitukset)</span></label><input type="tel" name="puhelin" required placeholder="+358..."></div>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Yritys</label><input type="text" name="yritys"></div>
      <div class="form-group"><label>Y-tunnus</label><input type="text" name="ytunnus" placeholder="1234567-8"></div>
    </div>
    <div class="form-group"><label>Sähköposti *</label><input type="email" name="email" required></div>
    <div class="form-group"><label>Salasana *</label><input type="password" name="salasana" required minlength="6"></div>

    <div class="form-group">
      <label>Toiminta-alueet * <span style="font-weight:400;text-transform:none">— valitse maakunnat joilla ajat</span></label>
      <div style="border:2px solid var(--musta);padding:1rem;display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem .8rem;max-height:260px;overflow-y:auto">
        {% for mk in maakunnat %}
        <label style="font-weight:400;text-transform:none;font-size:.85rem;display:flex;align-items:center;gap:.4rem;cursor:pointer">
          <input type="checkbox" name="alueet" value="{{ mk }}" style="width:auto;accent-color:#FFE000"> {{ mk }}
        </label>
        {% endfor %}
      </div>
    </div>

    <button class="btn btn-primary" style="width:100%;margin-top:.5rem">REKISTERÖIDY</button>
  </form>
  <p style="text-align:center;margin-top:1rem;font-size:.9rem">Jo tili? <a href="{{ url_for('rahtari.kuljettaja_kirjaudu') }}">Kirjaudu</a></p>
</div>
{% endblock %}
