{% extends "rahtari/base.html" %}
{% block title %}Kirjaudu — RAHTARI{% endblock %}
{% block content %}
<div style="max-width:400px;margin:3rem auto">
  <div class="section-title">Kuljettajan kirjautuminen</div>
  <form method="POST">
    <div class="form-group"><label>Sähköposti</label><input type="email" name="email" required></div>
    <div class="form-group"><label>Salasana</label><input type="password" name="salasana" required></div>
    <button class="btn btn-primary" style="width:100%">KIRJAUDU</button>
  </form>
  <p style="text-align:center;margin-top:1rem;font-size:.9rem">Ei tiliä? <a href="{{ url_for('rahtari.kuljettaja_rekisteroidy') }}">Rekisteröidy kuljettajaksi</a></p>
</div>
{% endblock %}
