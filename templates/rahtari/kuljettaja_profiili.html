{% extends "rahtari/base.html" %}
{% block title %}Profiili — RAHTARI{% endblock %}
{% block content %}
<div style="max-width:620px;margin:2rem auto">
  <div class="section-title">Profiili — {{ k.nimi }}</div>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="grid-2">
      <div class="form-group"><label>Puhelin *</label><input type="tel" name="puhelin" value="{{ k.puhelin }}" required></div>
      <div class="form-group"><label>Yritys</label><input type="text" name="yritys" value="{{ k.yritys or '' }}"></div>
    </div>

    <div class="form-group">
      <label>Toiminta-alueet <span style="font-weight:400;text-transform:none">— saat ilmoitukset vain valituille alueille</span></label>
      <div style="border:2px solid var(--musta);padding:1rem;display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem .8rem;max-height:280px;overflow-y:auto">
        {% for mk in maakunnat %}
        <label style="font-weight:400;text-transform:none;font-size:.85rem;display:flex;align-items:center;gap:.4rem;cursor:pointer">
          <input type="checkbox" name="alueet" value="{{ mk }}"
            {% if mk in valitut %}checked{% endif %}
            style="width:auto;accent-color:#FFE000"> {{ mk }}
        </label>
        {% endfor %}
      </div>
    </div>

    <button class="btn btn-primary" style="width:100%">TALLENNA</button>
  </form>
  <p style="margin-top:1rem;font-size:.85rem;color:var(--muted)">
    Valitut alueet: <strong>{{ valitut|join(', ') or '—' }}</strong>
  </p>
</div>
{% endblock %}
