{% extends "base.html" %}
{% block title %}Uusi kuljetustilaus — KuljetusHub{% endblock %}
{% block content %}

<div style="max-width:640px;margin:0 auto">
  <h1>Uusi kuljetustilaus</h1>
  <form method="POST" style="display:flex;flex-direction:column;gap:1.2rem;margin-top:1.5rem">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
      <div>
        <label class="form-label">📍 Noutoosoite *</label>
        <input type="text" name="nouto_osoite" class="form-input" placeholder="Katu, kaupunki" required>
      </div>
      <div>
        <label class="form-label">🏁 Toimitusosoite *</label>
        <input type="text" name="toimitus_osoite" class="form-input" placeholder="Katu, kaupunki" required>
      </div>
    </div>

    <div>
      <label class="form-label">📦 Tuotteen kuvaus *</label>
      <textarea name="tuote_kuvaus" class="form-input" rows="2" placeholder="Mitä kuljetetaan?" required style="resize:vertical"></textarea>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
      <div>
        <label class="form-label">Paino (kg)</label>
        <input type="text" name="paino" class="form-input" placeholder="esim. 500 kg">
      </div>
      <div>
        <label class="form-label">Mitat (cm)</label>
        <input type="text" name="mitat" class="form-input" placeholder="esim. 120×80×100">
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
      <div>
        <label class="form-label">⏰ Toivottu toimitusaika</label>
        <input type="datetime-local" name="deadline" class="form-input">
      </div>
      <div>
        <label class="form-label">💶 Maksimitarjous (€)</label>
        <input type="number" name="max_budjetti" class="form-input" placeholder="esim. 500" step="0.01" min="0">
      </div>
    </div>

    <button type="submit" class="btn btn-primary" style="align-self:flex-start;padding:.75rem 2rem">
      Julkaise tilaus
    </button>
  </form>
</div>

{% endblock %}
