{% extends "base.html" %}
{% block title %}Rekisteröidy kuljettajaksi — KuljetusHub{% endblock %}
{% block content %}
<div style="max-width:480px;margin:0 auto">
  <h1>Rekisteröidy kuljettajaksi</h1>
  <form method="POST" style="display:flex;flex-direction:column;gap:1rem;margin-top:1.5rem">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="form-label">Nimi *</label>
      <input type="text" name="nimi" class="form-input" required>
    </div>
    <div>
      <label class="form-label">Yritys</label>
      <input type="text" name="yritys" class="form-input">
    </div>
    <div>
      <label class="form-label">Puhelin</label>
      <input type="tel" name="puhelin" class="form-input">
    </div>
    <div>
      <label class="form-label">Sähköposti *</label>
      <input type="email" name="email" class="form-input" required>
    </div>
    <div>
      <label class="form-label">Salasana *</label>
      <input type="password" name="password" class="form-input" required minlength="6">
    </div>
    <button class="btn btn-primary" style="margin-top:.5rem">Rekisteröidy</button>
  </form>
  <p style="margin-top:1rem;text-align:center;font-size:.9rem">
    Jo tili? <a href="{{ url_for('kuljetus_kuljettaja_kirjaudu') }}">Kirjaudu</a>
  </p>
</div>
{% endblock %}
